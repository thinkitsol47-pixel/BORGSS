# Weekly encrypted backup of the Supabase database.
#
# Why: the free Supabase plan keeps no backups, and the journal's first
# database was lost outright (2026-09-30). This dumps the data every Sunday and
# keeps the last 90 days of copies as GitHub artifacts.
#
# **Encrypted before it is uploaded, always.** This repository is public, and
# artifacts of a public repository can be downloaded by any signed-in GitHub
# user. The dump holds every account's email and every confidential manuscript
# record, so it is sealed with AES-256 under BACKUP_PASSPHRASE first. Nothing
# unencrypted is ever uploaded or printed.
#
# Two files go into each backup:
#   public.sql  — the whole `public` schema: tables, data, RLS, sequences
#   auth.sql    — data only, from auth.users and auth.identities, so restored
#                 accounts keep their logins (the auth schema itself belongs
#                 to Supabase and exists in any new project)
#
# Restore steps: docs/PROGRESS.md → "Database backups".
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  the DIRECT_URL (session pooler, port 5432)
#   BACKUP_PASSPHRASE    a long passphrase, also kept somewhere safe offline

name: Database backup

on:
  schedule:
    - cron: "0 21 * * 0" # Sundays 21:00 UTC = Monday 02:00 in Pakistan
  workflow_dispatch: {} # a "Run workflow" button for an immediate backup

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::BACKUP_DATABASE_URL and BACKUP_PASSPHRASE must both be set as repository secrets."
            exit 1
          fi

      # The server is Postgres 17; pg_dump must be at least that version.
      - name: Install the Postgres 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump, then encrypt
        env:
          DB: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          STAMP=$(date -u +%Y-%m-%d)
          WORK=$(mktemp -d)
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump

          "$PGDUMP" "$DB" --schema=public --no-owner --no-privileges \
            --file="$WORK/public.sql"
          "$PGDUMP" "$DB" --data-only --table=auth.users --table=auth.identities \
            --no-owner --no-privileges --file="$WORK/auth.sql"

          tar -czf "$WORK/borjss-$STAMP.tar.gz" -C "$WORK" public.sql auth.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
            --symmetric --cipher-algo AES256 \
            --output "borjss-db-$STAMP.tar.gz.gpg" "$WORK/borjss-$STAMP.tar.gz"

          rm -rf "$WORK"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          ls -l borjss-db-*.gpg

      - name: Keep the encrypted copy for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: borjss-db-${{ env.STAMP }}
          path: borjss-db-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
